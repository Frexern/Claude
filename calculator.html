<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: right;
      overflow: hidden;
    }

    .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      word-break: break-all;
    }

    .result {
      color: #e2e8f0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active { transform: scale(0.94); opacity: 0.8; }

    .btn-num {
      background: #1a2a4a;
      color: #e2e8f0;
    }

    .btn-op {
      background: #e94560;
      color: white;
    }

    .btn-eq {
      background: #0f3460;
      color: #e2e8f0;
    }

    .btn-clear {
      background: #533483;
      color: white;
    }

    .btn-zero { grid-column: span 2; }

    button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-clear" onclick="toggleSign()">+/-</button>
      <button class="btn-clear" onclick="percent()">%</button>
      <button class="btn-op"    onclick="op('/')">÷</button>

      <button class="btn-num"   onclick="digit('7')">7</button>
      <button class="btn-num"   onclick="digit('8')">8</button>
      <button class="btn-num"   onclick="digit('9')">9</button>
      <button class="btn-op"    onclick="op('*')">×</button>

      <button class="btn-num"   onclick="digit('4')">4</button>
      <button class="btn-num"   onclick="digit('5')">5</button>
      <button class="btn-num"   onclick="digit('6')">6</button>
      <button class="btn-op"    onclick="op('-')">−</button>

      <button class="btn-num"   onclick="digit('1')">1</button>
      <button class="btn-num"   onclick="digit('2')">2</button>
      <button class="btn-num"   onclick="digit('3')">3</button>
      <button class="btn-op"    onclick="op('+')">+</button>

      <button class="btn-num btn-zero" onclick="digit('0')">0</button>
      <button class="btn-num"   onclick="dot()">.</button>
      <button class="btn-eq"    onclick="equals()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let stored = null;
    let operator = null;
    let newInput = false;

    const resultEl = document.getElementById('result');
    const exprEl = document.getElementById('expression');

    function update(val) {
      resultEl.textContent = val;
    }

    function digit(d) {
      if (newInput) { current = d; newInput = false; }
      else current = current === '0' ? d : current + d;
      update(current);
    }

    function dot() {
      if (newInput) { current = '0.'; newInput = false; }
      else if (!current.includes('.')) current += '.';
      update(current);
    }

    function op(o) {
      if (operator && !newInput) calculate();
      stored = parseFloat(current);
      operator = o;
      newInput = true;
      const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[o];
      exprEl.textContent = `${stored} ${sym}`;
    }

    function calculate() {
      if (operator === null || stored === null) return;
      const b = parseFloat(current);
      const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[operator];
      exprEl.textContent = `${stored} ${sym} ${b} =`;
      let res;
      switch (operator) {
        case '+': res = stored + b; break;
        case '-': res = stored - b; break;
        case '*': res = stored * b; break;
        case '/': res = b === 0 ? 'Error' : stored / b; break;
      }
      current = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));
      stored = null;
      operator = null;
      newInput = true;
      update(current);
    }

    function equals() { calculate(); }

    function clearAll() {
      current = '0'; stored = null; operator = null; newInput = false;
      exprEl.textContent = '';
      update('0');
    }

    function toggleSign() {
      current = String(parseFloat(current) * -1);
      update(current);
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      update(current);
    }

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') digit(e.key);
      else if (e.key === '.') dot();
      else if (['+', '-', '*', '/'].includes(e.key)) op(e.key);
      else if (e.key === 'Enter' || e.key === '=') equals();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        update(current);
      }
    });
  </script>
</body>
</html>
